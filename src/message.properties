# Esse arquivo é mais genérico.
# Estrutura Recomendada:
# Arquivo Genérico (mensagens.properties): Contém todas as chaves do sistema. Geralmente usa o idioma principal da sua empresa ou o inglês.
# Arquivos Específicos (mensagens_pt_BR.properties, mensagens_es.properties): Contêm apenas as traduções para esses idiomas específicos.

# Vantagem de se fazer isso:
# Evita erros: Se você esquecer de traduzir uma chave para o espanhol, o Java busca o texto no arquivo genérico em vez de travar a aplicação.
# Menos repetição: Se um termo for igual em vários idiomas, você pode deixá-lo apenas no arquivo genérico.

#Passo a Passo da Cascata:
# Idioma + País (mensagens_pt_PT.properties): Procura a tradução exata para Portugal.
# Apenas Idioma (mensagens_pt.properties): Se não achar o anterior, procura o português genérico.
# Locale Padrão da Máquina: Se ainda não achar, o Java tenta o idioma do servidor/computador onde o sistema está rodando (ex: se o servidor for en_US, ele tenta mensagens_en_US.properties).
# Arquivo Raiz (mensagens.properties): A última tentativa antes de desistir.
# Se a chave não existir em nenhum desses quatro passos, o Java lança o erro MissingResourceException.

